# Configuração do Supabase CLI (desenvolvimento local e `supabase db push`).
# Ajustes de produção (URL do site, Google, SMTP) são feitos no painel do Supabase.
project_id = "trivagas"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = false

[storage]
file_size_limit = "5MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false
